name: Retrieval floors
on:
  workflow_call:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: evaluation-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  floors:
    name: Retrieval floors and golden-set integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14.5"
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - name: Install evaluation dependencies under lock constraints
        run: python -m pip install -c requirements.lock.txt pydantic pydantic-settings PyYAML
      - name: Validate golden set and frozen source manifest
        run: python -m eval.validate --offline
      - name: Check unchanged retrieval floors and configuration drift
        run: python -m eval.gate
      - name: Verify frozen baseline still breaches retrieval floors
        run: |
          python - <<'PY'
          from eval.gate import check_floors, load_result, main
          assert check_floors(load_result('baseline')), 'Baseline no longer breaches floors'
          assert main(['--config', 'baseline']) == 1, 'Expected baseline gate rejection'
          print('Baseline correctly fails the shipped floors.')
          PY
