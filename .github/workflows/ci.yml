name: CI

# Stage 6. Two jobs, both blocking except where noted:
#   backend  - the full pytest suite against real Postgres, Qdrant and Neo4j
#   frontend - typecheck (blocking), vitest (blocking), eslint (non-blocking)
#
# The backend suite is only meaningful with its datastores up. Measured with
# them down: 5 failures in test_health_degradation.py and ~18 tests in 15
# minutes, because every Qdrant call burns QDRANT_TIMEOUT_SECONDS x
# QDRANT_MAX_RETRIES. Hence service containers rather than skips.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: trace
          POSTGRES_PASSWORD: trace
          POSTGRES_DB: trace
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U trace -d trace"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      qdrant:
        # Matched to qdrant-client==1.18.0. A client meaningfully newer than
        # its server is how the fulltext-index calls that
        # test_rag_integration.py exists to guard start failing again.
        image: qdrant/qdrant:v1.18.3
        ports: ["6333:6333"]
        # The image ships no curl or wget, so readiness is checked through
        # bash's /dev/tcp — the same probe docker-compose.local.yml uses.
        options: >-
          --health-cmd "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30

      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/tracedevpassword
        ports: ["7687:7687"]
        options: >-
          --health-cmd "cypher-shell -u neo4j -p tracedevpassword 'RETURN 1'"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 30
          --health-start-period 30s

    env:
      # 127.0.0.1 rather than localhost throughout: localhost resolves to ::1
      # first and Qdrant listens on IPv4 only, which cost ~2s per call.
      DATABASE_URL: postgresql+asyncpg://trace:trace@127.0.0.1:5432/trace
      DATABASE_URL_SYNC: postgresql+psycopg2://trace:trace@127.0.0.1:5432/trace
      # Not a secret: a throwaway value for a throwaway database. It only has
      # to clear validate_jwt_secret's 32-character minimum and avoid the
      # known-placeholder list, or the app refuses to start.
      JWT_SECRET_KEY: ci-only-not-a-secret-2f6a1c9d4b8e0357a1c9d4b8
      QDRANT_URL: http://127.0.0.1:6333
      TRACE_TEST_QDRANT_URL: http://127.0.0.1:6333
      NEO4J_URI: bolt://127.0.0.1:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: tracedevpassword
      # The ingestion worker polls a queue; nothing in the suite wants it.
      PROCESSING_QUEUE_WORKER_ENABLED: "false"
      # No GROQ_API_KEY. The suite needs none: test_health_degradation.py pins
      # the LLM component, and every other Groq call is mocked.

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Cache Hugging Face models
        # all-MiniLM-L6-v2 and the ms-marco cross-encoder are downloaded on
        # first use by the reranker warmup that runs in app startup. Without
        # this, every job pays the download and the slowest test setup grows
        # from ~11s to whatever the Hub gives us.
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-${{ hashFiles('backend/requirements.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Apply migrations
        # test_document_pipeline_integration.py uses real tables inside a
        # rolled-back transaction, and skips itself when Postgres is
        # unreachable. Without this step it would skip silently.
        run: alembic upgrade head

      - name: Run tests
        # --timeout bounds a hang: the slowest item measured locally is 10.9s,
        # so 120s leaves room for a cold model cache on a runner while still
        # failing a stuck test long before the job timeout.
        # -rs reports skips, so a silently skipped integration test is visible.
        # Coverage is reported and never gated.
        run: |
          pytest -q -rs \
            --timeout=120 \
            --cov=app --cov-report=term-missing:skip-covered

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Typecheck
        # Blocking from day one: tsc --noEmit is already clean.
        run: npx tsc --noEmit

      - name: Tests
        run: npx vitest run

      - name: Lint
        # Non-blocking until the count reaches zero: 42 problems today
        # (23 errors, 19 warnings). Flip continue-on-error off in the same
        # change that clears the last one.
        continue-on-error: true
        run: npx eslint .
