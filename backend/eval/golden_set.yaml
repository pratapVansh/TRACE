  question: "When we bring the steam boiler up from cold, how quickly are we allowed to increase the burn, and is there a cap on how fast the metal can heat up?"
  history: []
  expected_docs:
    - SOP-003_Boiler_Start-Up_Procedure.docx
  expected_evidence:
    - doc: SOP-003_Boiler_Start-Up_Procedure.docx
      contains: "Increase firing rate max 5%/minute to avoid thermal stress."
    - doc: SOP-003_Boiler_Start-Up_Procedure.docx
      contains: "Bring boiler to 42 barg at <= 50 deg C/hr heating rate."
  expected_facts:
    - fact: "Firing rate may be increased by at most 5% per minute"
      any_of: ["5%/minute", "5% per minute", "5 % per minute", "5 per cent per minute", "5 %/min"]
    - fact: "Heating rate limited to 50 deg C per hour"
      any_of: ["50 deg C/hr", "50 °C/hr", "50 °C per hour", "50°C/h", "50 degrees per hour", "50 deg c per hour", "≤ 50 °C/h"]
  must_refuse: false
  tags: [compound]
  review:
    status: approved
    reviewed_by: pratapVansh
    reviewed_on: "2026-09-13"
    notes: "Approved. Added accepted phrasings '5 %/min' and '≤ 50 °C/h'."

