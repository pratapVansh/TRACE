# TRACE Stage 5 golden set - REVIEWED (13 September 2026)
#
# 40 questions over the frozen 25-document corpus in corpus_manifest.yaml:
#   20 single_hop  - answer lives in one document (may need two passages of it)
#   10 multi_hop   - answer needs two or more documents
#    5 follow_up   - meaning depends on the prior turn in `history`
#    5 negative    - the corpus does not contain the answer; correct behaviour is to say so
#
# REVIEW STATE
# All 40 items were reviewed on 13 September 2026 (reviewed_by: pratapVansh).
# S01-S10 were decided item by item; S11-S40 were reviewed against the files in
# demo_dataset/ (SCN-003 against its rendered scan image) with every decision in
# review.notes. S04, S07, S10 and N05 were replaced; see their notes.
#
# PROVENANCE AND TRUST
# Items were drafted by Claude (an LLM) on 13 September 2026 from the extracted
# chunk text of every corpus document, then reviewed against the SOURCE FILES in
# demo_dataset/ (not against TRACE's extracted text, so extraction and OCR errors
# are not copied into the reference). source: probe:<id> = probe question kept
# verbatim; probe:<id>-revised = probe wording changed; new = written for this set.
#
# Machine checks: `python -m eval.validate` (schema, manifest, evidence in the
# indexed chunks, facts grounded in the expected documents). A passing validator
# proves the references exist in the corpus - correctness is from the review.
#
# HOW TO REVIEW AN ITEM
#   1. Open the source file(s) and confirm the question is answerable (or, for
#      negatives, genuinely unanswerable) from them.
#   2. Correct expected_docs, expected_evidence and expected_facts.
#   3. Widen any_of with other phrasings a correct answer could reasonably use.
#   4. Rewrite a question only if it is wrong or ambiguous - never to make it
#      easier. Probe questions were never revised; if you change one, set
#      source to "probe:<id>-revised" and say why in review.notes.
#   5. Set review.status to approved | revised | rejected, fill reviewed_by and
#      reviewed_on. Rejected items must be replaced to keep the 20/10/5/5 split.
#
# FIELD REFERENCE
#   expected_docs      filenames from corpus_manifest.yaml. For single_hop and
#                      follow_up every listed doc is required; for multi_hop each
#                      contributes partial credit; empty for negative items.
#   expected_evidence  exact text that must appear in a retrieved chunk. Passage-
#                      level, because document-level hits overstated the probe
#                      (13/13 while two answers were unsupported). Chosen to
#                      survive re-chunking: short, from inside one sentence/row.
#   expected_facts     what a correct answer must state. A fact is covered when
#                      the normalised answer contains ANY of its any_of strings.
#                      Matching will normalise case, whitespace, unicode hyphens
#                      (answers contain U+2011) and "deg C"/"°C" forms.
#   must_refuse        true only for negative items. For them, expected_facts
#                      is empty and the answer must say the information is not in
#                      the documents without inventing a value.
#   expected_resolution  follow_up only: the resolved search query must contain
#                      ANY of these (case-insensitive) for the turn to count as resolved.
#   in_source          per fact, default true: the validator requires one any_of
#                      phrase to occur in the expected documents. false only when
#                      a correct answer's wording cannot occur verbatim in the
#                      indexed text: derived conclusions (a yes/no comparison),
#                      values in table cells whose unit is only in the header, or
#                      OCR-garbled source text. Each case is explained in notes.
#   tags               difficulty labels for slicing results: compound,
#                      table_row, no_lexical_overlap, entity_resolution,
#                      ocr_source, false_premise, distractor_doc, long_doc.

golden_set_version: 1
corpus_manifest: corpus_manifest.yaml
drafted_by: claude (LLM draft)
drafted_on: "2026-09-13"
review_status: reviewed

items:

