# TRACE — development stack: the API and the one datastore it cannot run
# without.
#
#   docker compose up --build
#
# Qdrant and Neo4j are not here. They are optional at runtime (main.py logs a
# warning and carries on without either) and live in docker-compose.local.yml,
# which is the overlay to use for development and CI:
#
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up --build
#
# Configuration comes from .env.docker — copy .env.docker.example to it first.
# It is intentionally a hard requirement: booting with an unset JWT_SECRET_KEY
# is a failure worth hitting at compose time rather than in the app.

name: trace

# Both services run the same image. Declared once so they cannot drift, and so
# the second build is a pure cache hit rather than a second real build.
x-backend-build: &backend-build
  context: ./backend
  dockerfile: Dockerfile
  # "platforms" (a list), not "platform" — the latter is a service-level key and
  # the Compose schema rejects it here. The Dockerfile also pins --platform on
  # every FROM, so this only states the intent that the build is amd64-only.
  platforms:
    - linux/amd64

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trace}
      POSTGRES_DB: ${POSTGRES_DB:-trace}
    ports:
      # Exposed so host-side tooling (psql, inspect_db.py, Alembic run from a
      # venv) can reach the same database the containers use.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # depends_on: service_healthy is what orders migrations after the server
      # is actually accepting connections. The container is "running" several
      # seconds before that, and the initdb bootstrap restarts it once, so
      # without this the migration reliably loses the race on a cold volume.
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trace} -d ${POSTGRES_DB:-trace}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  # One-shot. Runs to completion, then exits; nothing restarts it.
  #
  # Migrations are deliberately not part of the backend's boot sequence. Run
  # implicitly on start, they execute once per replica and once per restart
  # loop, which turns a crash-looping container into repeated concurrent DDL
  # against a live database. As their own service they run exactly once per
  # `up`, and the API is gated behind their success.
  migrate:
    build: *backend-build
    image: trace-backend:dev
    env_file:
      - .env.docker
    environment:
      # PostgreSQL remains the existing native/local Windows service. Using
      # the Compose-only database here split durable document IDs from the
      # already-populated Qdrant Cloud, Aura, and Supabase records.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-trace}:${POSTGRES_PASSWORD:-trace}@host.docker.internal:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-trace}
      DATABASE_URL_SYNC: postgresql+psycopg2://${POSTGRES_USER:-trace}:${POSTGRES_PASSWORD:-trace}@host.docker.internal:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-trace}
    command: ["alembic", "upgrade", "head"]
    working_dir: /app
    restart: "no"

  # One-shot, idempotent first-user bootstrap. The values are read by Compose
  # from the project-root .env (not from env_file, which only configures the
  # container). Existing installations are never reset on restart: the script
  # exits successfully as soon as any SuperAdmin exists.
  bootstrap:
    image: trace-backend:dev
    env_file:
      - .env.docker
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-trace}:${POSTGRES_PASSWORD:-trace}@host.docker.internal:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-trace}
      DATABASE_URL_SYNC: postgresql+psycopg2://${POSTGRES_USER:-trace}:${POSTGRES_PASSWORD:-trace}@host.docker.internal:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-trace}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:?Set SUPER_ADMIN_EMAIL in the project .env}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:?Set SUPER_ADMIN_PASSWORD in the project .env}
      SUPER_ADMIN_FULL_NAME: ${SUPER_ADMIN_FULL_NAME:?Set SUPER_ADMIN_FULL_NAME in the project .env}
    command: ["python", "scripts/create_super_admin.py"]
    working_dir: /app
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  backend:
    build: *backend-build
    image: trace-backend:dev
    env_file:
      - .env.docker
    environment:
      # Cloud retrieval stores are sourced from the project .env at Compose
      # interpolation time. PostgreSQL remains the existing native/local
      # service; host.docker.internal makes that endpoint deterministic from
      # the container and avoids the unrelated Compose-only PostgreSQL data.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-trace}:${POSTGRES_PASSWORD:-trace}@host.docker.internal:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-trace}
      DATABASE_URL_SYNC: postgresql+psycopg2://${POSTGRES_USER:-trace}:${POSTGRES_PASSWORD:-trace}@host.docker.internal:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-trace}
      QDRANT_URL: ${QDRANT_URL:?Set the cloud QDRANT_URL in the project .env}
      QDRANT_API_KEY: ${QDRANT_API_KEY:?Set QDRANT_API_KEY in the project .env}
      QDRANT_COLLECTION_NAME: ${QDRANT_COLLECTION_NAME:-document_chunks}
      NEO4J_URI: ${NEO4J_URI:?Set the Aura NEO4J_URI in the project .env}
      NEO4J_USERNAME: ${NEO4J_USERNAME:?Set NEO4J_USERNAME in the project .env}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in the project .env}
      NEO4J_DATABASE: ${NEO4J_DATABASE:?Set the Aura NEO4J_DATABASE in the project .env}
      STORAGE_BACKEND: ${STORAGE_BACKEND:?Set STORAGE_BACKEND=supabase in the project .env}
      SUPABASE_URL: ${SUPABASE_URL:?Set SUPABASE_URL in the project .env}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?Set SUPABASE_SERVICE_ROLE_KEY in the project .env}
      SUPABASE_STORAGE_BUCKET: ${SUPABASE_STORAGE_BUCKET:-trace}
      SUPABASE_STORAGE_TIMEOUT_SECONDS: ${SUPABASE_STORAGE_TIMEOUT_SECONDS:-30}
      SUPABASE_STORAGE_MAX_RETRIES: ${SUPABASE_STORAGE_MAX_RETRIES:-3}
      SUPABASE_STORAGE_RETRY_BASE_DELAY_SECONDS: ${SUPABASE_STORAGE_RETRY_BASE_DELAY_SECONDS:-0.5}
      SUPABASE_STORAGE_RETRY_MAX_DELAY_SECONDS: ${SUPABASE_STORAGE_RETRY_MAX_DELAY_SECONDS:-5}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      # Uploaded documents are written to the API host's filesystem
      # (STORAGE_ROOT, LocalStorageService). Without a volume they live in the
      # container's writable layer and every `down`, rebuild or replacement
      # silently discards them while their rows stay in Postgres — leaving a
      # database full of documents whose bytes are gone.
      - backend_storage:/app/storage
    depends_on:
      migrate:
        # Start only after `alembic upgrade head` has exited 0. A non-zero exit
        # keeps the API down instead of serving against a stale schema.
        condition: service_completed_successfully
      bootstrap:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
  backend_storage:
